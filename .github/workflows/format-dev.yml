name: Format dev files

on:
  push:
    branches:
      - fix/dev-formatting

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format affected files
        run: npx --yes prettier@3.6.2 --write src/components/Mitgliedwerden.tsx src/lib/membershipApplication.ts src/pages/Mitgliedweden.tsx package.json src/index.css

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Mitgliedwerden.tsx src/lib/membershipApplication.ts src/pages/Mitgliedweden.tsx package.json src/index.css
          git commit -m "Format dev membership files"
          git push

      - name: Remove temporary formatter workflow
        if: success()
        run: |
          git rm .github/workflows/format-dev.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary formatting workflow" || true
          git push || true
