name: Deploy React Vite to Hostinger via FTP

on:
  push:
    branches: [dev]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm i --legacy-peer-deps

      - name: Build project
        env:
          VITE_MEMBERSHIP_PGP_PUBLIC_KEY: ${{ secrets.MEMBERSHIP_PGP_PUBLIC_KEY }}
          VITE_MEMBERSHIP_PGP_FINGERPRINT: ${{ secrets.MEMBERSHIP_PGP_FINGERPRINT }}
        run: npm run build

      - name: Verify build output
        run: ls -la dist

      - name: Deploy React build to /dev/
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_SERVER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          sftp_only: true
          local_path: './dist/*'
          remote_path: '/dev/'
          sftpArgs: '-o ConnectTimeout=5'

      - name: Deploy formmail endpoint to /dev/
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_SERVER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          sftp_only: true
          local_path: './formmail-80.php'
          remote_path: '/dev/'
          sftpArgs: '-o ConnectTimeout=5'
