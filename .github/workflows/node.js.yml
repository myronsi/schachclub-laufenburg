# temporary restoration workflow
name: Restore membership page

on:
  push:
    branches:
      - fix/restore-membership-page-21be

permissions:
  contents: write

jobs:
  restore-membership-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore 21be UI and local application workflow
        shell: bash
        run: |
          git checkout 21be0cbfd9397dfb0af930775cb246335389c693 -- src/components/Mitgliedwerden.tsx
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/Mitgliedwerden.tsx')
          s = p.read_text()
          s = s.replace('''import {\n  createEncryptedMembershipPdf,\n  isMinor,\n} from "@/lib/membershipApplication";''', '''import { isMinor } from "@/lib/membershipApplication";\nimport type { MembershipPdfData } from "@/lib/membershipApplication";\nimport { createMembershipEml, MEMBERSHIP_RECIPIENTS, openMembershipMail, prepareLocalMembershipApplication } from "@/lib/localMembershipMail";''')
          signature = '''const SignaturePad = ({ label, hint, valueRef, onSigned, onClear }: { label: string; hint: string; valueRef: React.MutableRefObject<HTMLCanvasElement | null>; onSigned: () => void; onClear: () => void; }) => {\n  const drawing = useRef(false); const signCanvas = useRef<HTMLCanvasElement | null>(null); const fileInput = useRef<HTMLInputElement | null>(null); const [open, setOpen] = useState(false);\n  const point = (canvas: HTMLCanvasElement, e: PointerEvent) => { const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };\n  const setup = (canvas: HTMLCanvasElement) => { const ratio=Math.max(window.devicePixelRatio||1,1); canvas.width=Math.max(canvas.clientWidth*ratio,1); canvas.height=Math.max(canvas.clientHeight*ratio,1); const x=canvas.getContext("2d"); if(x){x.setTransform(ratio,0,0,ratio,0,0);x.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);x.lineWidth=2;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#111827";} };\n  const clear = () => { const c=valueRef.current,x=c?.getContext("2d"); if(c&&x)x.clearRect(0,0,c.width,c.height); const sc=signCanvas.current,sx=sc?.getContext("2d"); if(sc&&sx)sx.clearRect(0,0,sc.width,sc.height); onClear(); };\n  const upload = (file: File) => { if(!file.type.startsWith("image/"))return; const reader=new FileReader(); reader.onload=()=>{const img=new Image(); img.onload=()=>{const c=valueRef.current;if(!c)return;const ratio=Math.max(window.devicePixelRatio||1,1);c.width=Math.max(c.clientWidth*ratio,1);c.height=Math.max(c.clientHeight*ratio,1);const x=c.getContext("2d");if(!x)return;x.setTransform(ratio,0,0,ratio,0,0);x.clearRect(0,0,c.clientWidth,c.clientHeight);const scale=Math.min((c.clientWidth-16)/img.width,(c.clientHeight-16)/img.height);const w=img.width*scale,h=img.height*scale;x.drawImage(img,(c.clientWidth-w)/2,(c.clientHeight-h)/2,w,h);onSigned();};img.src=String(reader.result);};reader.readAsDataURL(file); };\n  const accept = () => { const source=signCanvas.current,target=valueRef.current;if(!source||!target)return;const ratio=Math.max(window.devicePixelRatio||1,1);target.width=Math.max(target.clientWidth*ratio,1);target.height=Math.max(target.clientHeight*ratio,1);const tx=target.getContext("2d");if(!tx)return;tx.setTransform(ratio,0,0,ratio,0,0);tx.clearRect(0,0,target.clientWidth,target.clientHeight);const scale=Math.min(target.clientWidth/source.clientWidth,target.clientHeight/source.clientHeight);const w=source.clientWidth*scale,h=source.clientHeight*scale;tx.drawImage(source,(target.clientWidth-w)/2,(target.clientHeight-h)/2,w,h);setOpen(false);onSigned(); };\n  return <><div className="rounded-lg border bg-gray-50/70 p-4"><div className="mb-2 flex items-center justify-between gap-3"><div><h3 className="font-semibold text-gray-900">{label}</h3><p className="text-xs text-gray-500">{hint}</p></div><Button type="button" variant="outline" size="sm" onClick={clear}><Eraser className="mr-1 h-4 w-4"/>Löschen</Button></div><canvas ref={valueRef} className="h-32 w-full rounded-md border bg-white object-contain"/><div className="mt-3 flex flex-wrap gap-2"><Button type="button" variant="outline" size="sm" onClick={()=>{setOpen(true);setTimeout(()=>{if(signCanvas.current)setup(signCanvas.current);},0);}}><PenLine className="mr-1 h-4 w-4"/>Unterschrift zeichnen</Button><Button type="button" variant="outline" size="sm" onClick={()=>fileInput.current?.click()}><Upload className="mr-1 h-4 w-4"/>Unterschrift hochladen</Button><input ref={fileInput} type="file" accept="image/png,image/jpeg,image/webp" className="hidden" onChange={e=>{const file=e.target.files?.[0];if(file)upload(file);e.currentTarget.value="";}}/></div></div>{open&&<div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" role="dialog" aria-modal="true" aria-label={label}><div className="w-full max-w-2xl rounded-xl bg-white p-5 shadow-xl"><div className="mb-3 flex items-center justify-between"><div><h3 className="text-lg font-semibold text-gray-900">{label}</h3><p className="text-sm text-gray-500">Bitte unterschreiben Sie im Feld.</p></div><Button type="button" variant="outline" size="sm" onClick={()=>setOpen(false)}>Schließen</Button></div><canvas ref={signCanvas} className="h-48 w-full cursor-crosshair touch-none rounded-md border bg-white" onPointerDown={e=>{const c=signCanvas.current,x=c?.getContext("2d");if(!c||!x)return;drawing.current=true;c.setPointerCapture(e.pointerId);const q=point(c,e.nativeEvent);x.beginPath();x.moveTo(q.x,q.y);}} onPointerMove={e=>{if(!drawing.current)return;const c=signCanvas.current,x=c?.getContext("2d");if(!c||!x)return;const q=point(c,e.nativeEvent);x.lineTo(q.x,q.y);x.stroke();}} onPointerUp={()=>{drawing.current=false}} onPointerCancel={()=>{drawing.current=false}}/><div className="mt-3 flex justify-between gap-2"><Button type="button" variant="outline" onClick={()=>{const c=signCanvas.current,x=c?.getContext("2d");if(c&&x)x.clearRect(0,0,c.width,c.height)}}><Eraser className="mr-1 h-4 w-4"/>Löschen</Button><Button type="button" onClick={accept} className="bg-club-accent hover:bg-club-accent/90">Unterschrift übernehmen</Button></div></div></div>}</>;\n};\nfunction ibanOkay'''
          s2 = re.sub(r'const SignaturePad = \(\{.*?\nfunction ibanOkay', signature, s, count=1, flags=re.S)
          if s2 == s: raise SystemExit('signature replacement failed')
          s = s2
          state = '''  const [form, setForm] = useState(initialForm);\n  const [applicantSigned, setApplicantSigned] = useState(false);\n  const [guardianSigned, setGuardianSigned] = useState(false);\n  const [mandateSigned, setMandateSigned] = useState(false);\n  const [terms, setTerms] = useState(false);\n  const [privacy, setPrivacy] = useState(false);\n  const [busy, setBusy] = useState(false);\n  const [prepared, setPrepared] = useState<{file: File; name: string} | null>(null);\n  const [message, setMessage] = useState("");'''
          s2 = re.sub(r'  const \[form, setForm\] = useState\(initialForm\),.*?setMessage\(""\);', state, s, count=1, flags=re.S)
          if s2 == s: raise SystemExit('state replacement failed')
          s = s2
          s = s.replace('''  const set = (k: keyof FormState, v: string | boolean) =>\n    setForm((x) => ({ ...x, [k]: v }));''', '''  const set = (k: keyof FormState, v: string | boolean) => { setForm((x) => ({ ...x, [k]: v })); setPrepared(null); setMessage(""); };''')
          s = s.replace('''    setPrivacy(false);\n  };''', '''    setPrivacy(false); setPrepared(null); setMessage("");\n  };''', 1)
          local = '''  const validate = (el: HTMLFormElement) => { if(!el.checkValidity()){el.reportValidity();return false;} if(!terms||!privacy){setMessage("Bitte bestätigen Sie Satzung und Datenschutzhinweise.");return false;} if(!applicantSigned){setMessage("Bitte unterschreiben Sie den Antrag.");return false;} if(minor&&(!form.representative_name.trim()||!guardianSigned)){setMessage("Für Minderjährige werden Name und Unterschrift der gesetzlichen Vertretung benötigt.");return false;} if(form.direct_debit&&(!ibanOkay(form.iban)||(form.bic.trim()&&!/^[A-Za-z]{6}[A-Za-z0-9]{2}([A-Za-z0-9]{3})?$/.test(form.bic))||!mandateSigned)){setMessage(!ibanOkay(form.iban)?"Bitte prüfen Sie die IBAN.":form.bic.trim()&&!/^[A-Za-z]{6}[A-Za-z0-9]{2}([A-Za-z0-9]{3})?$/.test(form.bic)?"Bitte prüfen Sie die BIC.":"Bitte prüfen Sie die Unterschrift der Einzugsermächtigung.");return false;}return true;};\n  const prepare = async (e: FormEvent<HTMLFormElement>) => { e.preventDefault(); setMessage(""); if(!validate(e.currentTarget))return; setBusy(true); try{const data:MembershipPdfData={...form,nationality:form.nationality==="Sonstige"?`Sonstige: ${form.nationality_other.trim()}`:form.nationality,representative_name:minor?form.representative_name.trim():"",signatures:{applicant:applicant.current?.toDataURL("image/png")||"",representative:minor?guardian.current?.toDataURL("image/png")||"":"",mandate:form.direct_debit?mandate.current?.toDataURL("image/png")||"":""},created:new Date().toISOString(),text_version:"2026-10-24-final"};const result=await prepareLocalMembershipApplication(data);setPrepared(result);setMessage("Die PDF wurde ausschließlich in Ihrem Browser erstellt. Sie wurde noch nicht versendet. Speichern Sie die Datei und fügen Sie sie in Ihrem E-Mail-Programm als Anhang hinzu.");}catch(err){setMessage(err instanceof Error?err.message:"Die PDF konnte nicht erstellt werden.");}finally{setBusy(false);} };\n  const download=()=>{if(!prepared)return;const url=URL.createObjectURL(prepared.file);const a=document.createElement("a");a.href=url;a.download=prepared.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);};\n  const mail=()=>{if(prepared)openMembershipMail(MEMBERSHIP_RECIPIENTS,prepared.name);};\n  const eml=async()=>{if(!prepared)return;const text=await createMembershipEml(prepared.file,MEMBERSHIP_RECIPIENTS);const blob=new Blob([text],{type:"message/rfc822"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="SC-Aufnahmeantrag.eml";a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);};\n'''
          start=s.find('  const submit = async')
          if start < 0: raise SystemExit('submit start not found')
          end=s.find('  return (', start)
          if end < 0: raise SystemExit('component return not found')
          s=s[:start]+local+s[end:]
          footer = '''                <div className="flex flex-col gap-3 rounded-lg border bg-gray-50 p-4 sm:flex-row sm:items-center sm:justify-between">\n                  <p className="max-w-xl text-xs leading-5 text-gray-500">Die PDF wird vollständig in Ihrem Browser erstellt. Sie wird nicht an den Webserver hochgeladen. Danach können Sie sie speichern, in Ihrem E-Mail-Programm als Anhang verwenden oder einen lokalen E-Mail-Entwurf erzeugen.</p>\n                  <div className="flex flex-wrap gap-2 sm:justify-end"><Button type="submit" disabled={busy} className="bg-club-accent hover:bg-club-accent/90">{busy ? <><Clock className="mr-2 h-4 w-4 animate-spin" />PDF wird erstellt...</> : <><FileText className="mr-2 h-4 w-4" />PDF vorbereiten</>}</Button>{prepared && <><Button type="button" variant="outline" onClick={download}>PDF speichern</Button><Button type="button" variant="outline" onClick={mail}><Mail className="mr-2 h-4 w-4" />E-Mail öffnen</Button><Button type="button" variant="outline" onClick={eml}>E-Mail-Entwurf (.eml)</Button></>}</div>\n                </div>\n              </form>'''
          s2=re.sub(r'                <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">.*?                </div>\n              </form>',footer,s,count=1,flags=re.S)
          if s2==s: raise SystemExit('footer replacement failed')
          p.write_text(s2)
          PY
          if git diff --quiet HEAD -- src/components/Mitgliedwerden.tsx; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Mitgliedwerden.tsx
          git commit -m "Restore membership page and local application workflow"
          git push