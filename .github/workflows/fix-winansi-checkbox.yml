name: Fix membership PDF checkbox glyph

on:
  push:
    branches:
      - fix/winansi-checkbox-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Unicode checkbox glyphs with vector boxes
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/lib/membershipApplication.ts")
          s = p.read_text()

          marker = 'function check(page:any,x:number,y:number){'
          if 'function box(page:any,x:number,y:number)' not in s:
              start = s.index(marker)
              end = s.index('\n', start)
              s = s[:end + 1] + 'function box(page:any,x:number,y:number){page.drawRectangle({x,y,width:7,height:7,borderWidth:.7,color:ink});}\n' + s[end + 1:]

          replacements = {
              'text(page,helv,"□ Deutsch",153,507,9);': 'box(page,151,504);text(page,helv,"Deutsch",162,507,9);',
              'text(page,helv,"□ EU-Angehöriger",225,507,9);': 'box(page,223,504);text(page,helv,"EU-Angehöriger",234,507,9);',
              'text(page,helv,"□ Sonstige:",350,507,9);': 'box(page,348,504);text(page,helv,"Sonstige:",359,507,9);',
              'text(page,helv,"□ männlich",153,480,9);': 'box(page,151,477);text(page,helv,"männlich",162,480,9);',
              'text(page,helv,"□ weiblich",225,480,9);': 'box(page,223,477);text(page,helv,"weiblich",234,480,9);',
              'text(page,helv,"□ Aktivmitglied",153,453,9);': 'box(page,151,450);text(page,helv,"Aktivmitglied",162,453,9);',
              'text(page,helv,"□ Passivmitglied",265,453,9);': 'box(page,263,450);text(page,helv,"Passivmitglied",274,453,9);',
              'text(page,helv,"□ Ich habe die Datenschutzerklärung des badischen Schachverbandes zur Kenntnis genommen.",35,426,9,525);': 'box(page,35,423);text(page,helv,"Ich habe die Datenschutzerklärung des badischen Schachverbandes zur Kenntnis genommen.",47,426,9,513);',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Expected checkbox source not found: {old}")
              s = s.replace(old, new, 1)

          if '□' in s:
              raise SystemExit("A Unicode checkbox glyph remains in membershipApplication.ts")

          p.write_text(s)
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/membershipApplication.ts .github/workflows/fix-winansi-checkbox.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: draw membership PDF checkboxes as vector boxes"
          git push origin HEAD:fix/winansi-checkbox-v2
