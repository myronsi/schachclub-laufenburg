name: Fix membership PDF WinAnsi checkbox

on:
  push:
    branches:
      - fix/winansi-checkbox
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Patch WinAnsi-incompatible checkbox character
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/lib/membershipApplication.ts")
          s = p.read_text()
          old = 'const text=String(value??"").trim();'
          new = 'const text=String(value??"").trim().replace(/\\u25A1/g, "");'
          if old not in s:
              raise SystemExit("Expected drawText line was not found")
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-winansi-checkbox.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/membershipApplication.ts .github/workflows/fix-winansi-checkbox.yml
          git commit -m "fix: remove WinAnsi-incompatible checkbox from membership PDF text"
          git push origin HEAD:fix/winansi-checkbox
